<!-- FOCO -->
<div class="magic-info-section">

    <!-- ATRIBUTO DE ATAQUE -->

    <div class="resource-counter hp-counter">
        <label for="system.magicAttack.dc">{{ localize 'SPAO.MagicAtribute' }}</label>
        <div class="resource-input-wrapper">
            <select name="system.magicAttack.atrib" class="item-sheet-skills">
                {{#select system.magicAttack.atrib}}
                <option value="">Atributo</option>
                <option value="for">{{localize 'SPAO.for'}}</option>
                <option value="des">{{localize 'SPAO.des'}}</option>
                <option value="int">{{localize 'SPAO.int'}}</option>
                <option value="car">{{localize 'SPAO.car'}}</option>
                {{/select}}
            </select>
        </div>
    </div>


    <!-- PROFICIÊNCIA DE ATAQUE -->

    <div class="resource-counter hp-counter">
        <label for="system.magicAttack.prof">{{ localize 'SPAO.MagicProficiency' }}</label>
        <div class="resource-input-wrapper">
            <select name="system.magicAttack.prof" class="item-sheet-skills">
                {{#select data.system.magicAttack.prof}}
                <option value="untrained">{{localize 'SPAO.untrained'}}</option>
                <option value="trained">{{localize 'SPAO.trained'}}</option>
                <option value="expert">{{localize 'SPAO.expert'}}</option>
                <option value="master">{{localize 'SPAO.master'}}</option>
                {{/select}}
            </select>
        </div>
    </div>


    <!-- DC -->

    <div class="resource-counter hp-counter">
        <label for="system.magicAttack.dc">{{ localize 'SPAO.MagicDC' }}</label>
        <div class="resource-input-wrapper">
            <input type="text" name="system.magicAttack.dc" id="system.magicAttack.dc"
                value="{{data.system.magicAttack.dc}}" data-dtype="Number" />
        </div>
    </div>


</div>

<!-- PONTOS DE FOCO -->
<div class="magic-info-section">

    <div class="resource-counter hp-counter">
        <label for="system.focus.value">{{ localize 'SPAO.Focus' }}</label>
        <div class="resource-input-wrapper">
            <input type="text" name="system.focus.value" id="system.focus.value" value="{{data.system.focus.value}}"
                data-dtype="Number" />
            <span> / </span>
            <input type="text" name="system.focus.max" value="{{data.system.focus.max}}" data-dtype="Number" />
        </div>
    </div>

</div>


<div class="magic-section">
    <!-- Cabeçalho das magias -->
    <div class="spao-items-list-header actor-sheet-list-header">
        <div class="magic-header-name">{{ localize 'SPAO.MagicName' }}</div>
    </div>

    <!-- Lista de magias -->
    <div class="magic-items-list">
        {{#each actor.items as |item id|}}
        {{#if (eq item.type "magia")}}
        <div class="item spao-items-list-row magic-item-row" data-item-id="{{item._id}}">
            <div class="spao-items-list-row-header magic-item-header">
                <!-- Imagem da magia -->
                <div class="magic-item-image">
                    <img src="{{item.img}}" title="{{item.name}}" />
                </div>

                <!-- Nome da magia -->
                <div class="spao-item-name-and-tags magic-item-name">
                    <a class="magic-name">{{item.name}}</a>
                </div>

                <!-- Display do Tier - alinhado com a coluna -->
                <div class="magic-tier-display">
                    <div class="tier-value">
                        <span class="current-tier">Tier {{item.system.currentTier}}</span>
                    </div>
                </div>

                <!-- Botões de ação -->
                <div class="spao-item-controls magic-item-controls">
                    <a class="item-edit" title="{{ localize 'SPAO.Edit' }}">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a class="item-delete" title="{{ localize 'SPAO.Delete' }}">
                        <i class="fas fa-trash"></i>
                    </a>
                    <a class="item-cast" title="{{ localize 'SPAO.Cast' }}">
                        <i class="fas fa-bolt"></i>
                    </a>
                </div>
            </div>

            <!-- Descrição da magia (opcional, pode ser expandida) -->
            <!-- {{#if item.system.description}}
            <div class="magic-description">
                <p>{{item.system.description}}</p>
            </div>
            {{/if}} -->
        </div>
        {{/if}}
        {{/each}}

        <!-- Mensagem quando não há magias -->
        {{#unless (hasMagic actor.items)}}
        <div class="no-magic-message">
            <p>{{ localize 'SPAO.NoMagic' }}</p>
        </div>
        {{/unless}}
    </div>

    <!-- Botão para adicionar novo item -->
    <div class="inventory-footer">
        <button class="magia-create inventory-add-item" type="button">
            <i class="fas fa-plus"></i> {{ localize 'SPAO.AddMagic' }}
        </button>
    </div>
</div>
