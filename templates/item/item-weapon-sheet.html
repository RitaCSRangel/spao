<form class="cairn" autocomplete="off">
    <div class="item-sheet-grid weapon">
        <!-- Portrait -->
        <div class="item-sheet-section-portrait">
            <img class="portrait" src="{{data.img}}" data-edit="img" title="{{data.name}}" />           
        </div>
        <!-- Name -->
        <div class="item-sheet-section-name">
            <input class="name-input" type="text" name="name" value="{{data.name}}" placeholder="{{ localize 'SPAO.Name' }}" />
        </div>
        <!-- Equipped -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="system.equipped">{{ localize 'SPAO.Equipped' }}</label>
            <div class="resource-input-wrapper">
                <input type="checkbox" {{checked data.system.equipped}} name="system.equipped" id="system.equipped"
                       value="{{data.system.equipped}}" data-dtype="Boolean" {{ disabled (not item.system.isEquipable) }} />
            </div>
        </div>
        

         <!-- Damage -->
         <div class="resource-counter short-counter" >
            <label class="short-resource-label" for="system.damageFormula" 
                title="{{ localize 'SPAO.Damage' }}">{{ localize 'SPAO.Damage' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.damageDice" id="system.damageDice"
                       value="{{data.system.damageDice}}" data-dtype="String" />
            </div>
         </div>
         
        <!-- Number of uses -->
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="system.uses.value">{{ localize 'SPAO.Uses' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.uses.value" id="system.uses.value"
                        value="{{data.system.uses.value}}" data-dtype="Number" />
            </div>
        </div>
        <div class="resource-counter long-counter">
            <label class="large-resource-label" for="system.uses.max">{{ localize 'SPAO.MaxUses' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.uses.max" id="system.uses.max"
                      value="{{data.system.uses.max}}" data-dtype="Number" />
            </div>
        </div>

         <!-- Cost -->
         <div class="resource-counter long-counter">
            <label class="large-resource-label" for="system.cost.value">{{ localize 'SPAO.Cost' }}</label>
            <div class="resource-input-wrapper">
                <input type="text" name="system.cost.value" id="system.cost.value"
                    value="{{data.system.cost.value}}" data-dtype="Number" />
            </div>
        </div>

        <div class="item-sheet-section-tabs">
            <nav class="tabs" data-group="primary">
                <a class="item" data-group="primary" data-tab="description">{{ localize 'SPAO.Description' }}</a>
            </nav>
            <section class="content">
                <div class="tab" data-group="primary" data-tab="description">
                    {{ editor enrichedDescription target="system.description" button=true owner=owner editable=editable engine="prosemirror" collaborate=true }}
                </div>
            </section>
        </div>
    </div>
</form>
