<form class="spao item-sheet" autocomplete="off">
    <header class="item-header">
        <!-- Portrait -->
        <img class="item-img" src="{{data.img}}" data-edit="img" title="{{data.name}}" />


        <!-- Name -->
        <div class="item-name">
            <input class="item-sheet-name" type="text" name="name" value="{{data.name}}"
                placeholder="{{ localize 'SPAO.Name' }}" />
        </div>
    </header>

    <section class="item-body">
        <!-- Left Side details -->
        <div class="item-summary">

            <!-- Cost -->
            <div class="item-resource-counter short-counter">
                <label class="item-sheet-resource-label" for="system.cost">{{ localize 'SPAO.Cost' }}</label>
                <div class="resource-input-wrapper">
                    <input type="text" name="system.cost" id="system.cost" value="{{data.system.cost}}"
                        data-dtype="Number" />
                </div>
            </div>

            <!-- Quantity -->
            <div class="item-resource-counter short-counter">
                <label class="item-sheet-resource-label" for="system.quantity">{{ localize 'SPAO.Quantity'
                    }}</label>
                <div class="resource-input-wrapper">
                    <input type="text" name="system.quantity" id="system.quantity" value="{{data.system.quantity}}"
                        data-dtype="Number" />
                </div>
            </div>

            <div class="item-sheet-resource-dropdowns">
                <!-- Uses Current -->
                <div class="item-resource-counter short-counter">
                    <label class="item-sheet-resource-label" for="system.uses.value">{{ localize 'SPAO.Uses'
                        }}</label>
                    <div class="resource-input-wrapper">
                        <input type="text" name="system.uses.value" id="system.uses.value"
                            value="{{data.system.uses.value}}" data-dtype="Number" />
                        <span> / </span>
                        <input type="text" name="system.uses.max" id="system.uses.max" value="{{data.system.uses.max}}"
                            data-dtype="Number" />
                    </div>
                </div>
            </div>

        </div>

        <div class="item-content">
            <div class="character-sheet-section-tabs">

                <!-- TABS: NAV HEADER -->
                <nav class="tabs" data-group="primary">
                    <a class="item" data-group="primary" data-tab="descricao">{{ localize 'SPAO.Description' }}</a>
                </nav>


                <section class="content">

                    <!-- TABS: DESCRIÇÃO -->
                    <div class="tab" data-group="primary" data-tab="descricao">
                        {{ editor enrichedNotes target="system.description" button=true owner=owner
                        editable=editable
                        engine="prosemirror" collaborate=true }}
                    </div>

                </section>
                
            </div>
        </div>
    </section>
</form>
